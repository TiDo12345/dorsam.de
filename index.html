<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>dorsam.de</title>
<style>
  :root { --bg: #f6f5f2; --fg: #1d1d1f; --muted: #6e6e73; --line: #d9d6cf; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151517; --fg: #ececee; --muted: #9a9aa0; --line: #2c2c30; }
  }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { text-align: center; padding: 0 16px; }
  h1 { font-size: clamp(2rem, 6vw, 3.25rem); font-weight: 600; letter-spacing: -0.02em; margin: 0; }
  hr { width: 48px; border: 0; border-top: 2px solid var(--line); margin: 1.25rem auto; }
  p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
  <h1>dorsam.de</h1>
  <hr>
  <p>Private Domain – hier gibt es nichts zu sehen.</p>
</main>
</body>
</html>
